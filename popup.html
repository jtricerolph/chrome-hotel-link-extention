<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Activity Tracker</h1>
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Detecting...</span>
      </div>
    </header>

    <div class="content">
      <!-- Activity Detection Section -->
      <section class="activity-section">
        <h2>Current Activity</h2>
        <div class="activity-info" id="activityInfo">
          <div class="loading">Analyzing current page...</div>
        </div>
      </section>

      <!-- Information Section -->
      <section class="info-section" id="infoSection" style="display: none;">
        <h2>Related Information</h2>
        <div id="infoContent"></div>
      </section>

      <!-- Links Section -->
      <section class="links-section" id="linksSection" style="display: none;">
        <h2>Quick Links</h2>
        <div id="linksContainer"></div>
      </section>

      <!-- Error Section -->
      <section class="error-section" id="errorSection" style="display: none;">
        <div class="error-message" id="errorMessage"></div>
      </section>
    </div>

    <footer>
      <button id="refreshBtn" class="btn btn-primary">Refresh</button>
      <button id="settingsBtn" class="btn btn-secondary">Settings</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
