<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background square with rounded corners -->
  <rect x="4" y="4" width="120" height="120" rx="20" fill="#2c3e50"/>

  <!-- Restaurant/Dining icon - larger and simpler -->
  <g fill="#ffffff">
    <!-- Fork (left side) -->
    <g>
      <!-- Fork prongs -->
      <rect x="25" y="30" width="6" height="32" rx="2"/>
      <rect x="36" y="30" width="6" height="32" rx="2"/>
      <rect x="47" y="30" width="6" height="32" rx="2"/>
      <!-- Fork handle -->
      <rect x="31" y="62" width="16" height="36" rx="3"/>
    </g>

    <!-- Knife (right side) -->
    <g>
      <!-- Knife blade -->
      <path d="M 75 30 L 90 30 L 87 62 L 78 62 Z"/>
      <!-- Knife handle -->
      <rect x="79" y="62" width="11" height="36" rx="3"/>
    </g>
  </g>
</svg>
